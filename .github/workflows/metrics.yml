name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # Stats card (includes private repos via METRICS_TOKEN with `repo` scope)
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics/stats.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Dhruvesh16
          template: classic
          base: header, activity, community, repositories
          repositories_affiliations: owner, collaborator, organization_member
          config_timezone: Asia/Kolkata

      # Most used languages (private repos included)
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics/languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Dhruvesh16
          template: classic
          base: ""
          repositories_affiliations: owner, collaborator, organization_member
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_ignored: html, css, makefile, cmake, shell, dockerfile
          config_timezone: Asia/Kolkata
